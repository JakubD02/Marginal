[project]
name = "marginal"
version = "0.1.0"
description = "Business profitability simulator with AI advisor"
requires-python = ">=3.11"

[project.scripts]
seed = "scripts.seed:seed"
smoke-test = "scripts.smoke_test:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B",
]
ignore = [
    "E501",  # line too long
    "B008",  # function call in argument defaults (needed for Typer)
]