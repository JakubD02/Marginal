[project]
name = "marginal"
version = "0.1.0"
description = "Business profitability simulator with AI advisor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jakub Dudicz" },
]

dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[project.scripts]
marginal = "marginal.cli:app"
seed = "marginal.scripts.seed:seed"
smoke-test = "marginal.scripts.smoke_test:main"

[tool.setuptools.packages.find]
include = ["marginal*"]
exclude = ["alembic*", "tests*", "venv*", ".venv*", "advisor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B",
]
ignore = [
    "E501",  # line too long
    "B008",  # function call in argument defaults (needed for Typer)
]
